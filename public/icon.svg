<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background with rounded corners (safe maskable margins) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer subtle tech border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Main Blueprint Shield Document Card -->
  <g filter="url(#shadow)">
    <!-- Document background -->
    <rect x="116" y="96" width="280" height="320" rx="36" fill="#1e293b" stroke="#3b82f6" stroke-width="6"/>

    <!-- Document Header Ribbon -->
    <path d="M 116 132 C 116 112 132 96 152 96 L 360 96 C 380 96 396 112 396 132 L 396 168 L 116 168 Z" fill="url(#blueGrad)"/>

    <!-- Document Text / Architecture Lines -->
    <rect x="156" y="210" width="140" height="18" rx="9" fill="#94a3b8" />
    <rect x="320" y="210" width="40" height="18" rx="9" fill="#60a5fa" />
    
    <rect x="156" y="250" width="110" height="16" rx="8" fill="#64748b" />
    <rect x="300" y="250" width="60" height="16" rx="8" fill="#94a3b8" />

    <rect x="156" y="286" width="130" height="16" rx="8" fill="#64748b" />
    <rect x="310" y="286" width="50" height="16" rx="8" fill="#94a3b8" />

    <!-- Total divider line -->
    <line x1="156" y1="324" x2="360" y2="324" stroke="#475569" stroke-width="3" stroke-dasharray="6 4" />

    <!-- Total highlight -->
    <rect x="156" y="344" width="80" height="22" rx="11" fill="#3b82f6" />
    <rect x="270" y="344" width="90" height="22" rx="11" fill="#22c55e" />

    <!-- Stamp check circle in bottom right -->
    <circle cx="360" cy="380" r="44" fill="#2563eb" stroke="#ffffff" stroke-width="6"/>
    <!-- Checkmark icon inside circle -->
    <path d="M 342 380 L 354 392 L 380 366" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Brand acronym BD in top bar -->
  <text x="256" y="146" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">BÂTIDEVIS</text>
</svg>
